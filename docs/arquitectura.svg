<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Carlito, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.4;rx:8}
      .aws{fill:#fff7ed;stroke:#c2410c}
      .lam{fill:#fffbeb;stroke:#b45309}
      .db{fill:#eff6ff;stroke:#1d4ed8}
      .msg{fill:#fdf2f8;stroke:#be185d}
      .sec{fill:#f0fdf4;stroke:#15803d}
      .t{font-size:14px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .s{font-size:11.5px;fill:#475569;text-anchor:middle}
      .l{fill:none;stroke:#475569;stroke-width:1.4;marker-end:url(#a)}
      .f1{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#b)}
      .f2{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#g)}
      .f3{fill:none;stroke:#ea580c;stroke-width:2;marker-end:url(#o)}
      .n{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
      .cap{font-size:11px;fill:#334155}
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <!-- AWS boundary -->
  <rect x="165" y="12" width="830" height="470" fill="none" stroke="#f97316" stroke-dasharray="6 4" rx="10"/>
  <text x="178" y="30" font-size="12" font-weight="700" fill="#c2410c">AWS Cloud · us-east-1 · IAM: rol de mínimo privilegio por Lambda</text>

  <!-- Users -->
  <rect class="box" x="15" y="140" width="130" height="130"/>
  <text class="t" x="80" y="165">Usuarios</text>
  <text class="s" x="80" y="190">Comprador</text>
  <text class="s" x="80" y="210">Staff en la puerta</text>
  <text class="s" x="80" y="230">(celular + cámara)</text>
  <text class="s" x="80" y="250">Organizador</text>

  <!-- Frontend -->
  <rect class="box aws" x="185" y="160" width="125" height="90"/>
  <text class="t" x="247" y="190">Frontend</text>
  <text class="s" x="247" y="208">React + Vite</text>
  <text class="s" x="247" y="225">Amazon S3</text>
  <text class="s" x="247" y="240">(sitio estático)</text>

  <!-- API GW -->
  <rect class="box aws" x="335" y="160" width="115" height="90"/>
  <text class="t" x="392" y="195">API Gateway</text>
  <text class="s" x="392" y="214">HTTP API · REST</text>
  <text class="s" x="392" y="230">/eventos /compras</text>
  <text class="s" x="392" y="244">/checkin</text>

  <!-- Lambdas -->
  <rect class="box lam" x="480" y="60" width="150" height="50"/>
  <text class="t" x="555" y="82">λ comprar-boleto</text>
  <text class="s" x="555" y="99">valida datos y cupo</text>
  <rect class="box lam" x="480" y="180" width="150" height="50"/>
  <text class="t" x="555" y="202">λ eventos</text>
  <text class="s" x="555" y="219">alta / consulta</text>
  <rect class="box lam" x="480" y="290" width="150" height="50"/>
  <text class="t" x="555" y="312">λ check-in</text>
  <text class="s" x="555" y="329">valida firma del QR</text>

  <!-- SQS -->
  <rect class="box msg" x="660" y="40" width="130" height="55"/>
  <text class="t" x="725" y="63">Amazon SQS</text>
  <text class="s" x="725" y="81">cola-emisión + DLQ</text>

  <!-- generar boleto -->
  <rect class="box lam" x="830" y="40" width="145" height="55"/>
  <text class="t" x="902" y="63">λ generar-boleto</text>
  <text class="s" x="902" y="81">PDF + QR firmado</text>

  <!-- DynamoDB -->
  <rect class="box db" x="660" y="165" width="130" height="80"/>
  <text class="t" x="725" y="192">DynamoDB</text>
  <text class="s" x="725" y="210">Eventos · Boletos</text>
  <text class="s" x="725" y="226">escrituras</text>
  <text class="s" x="725" y="239">condicionales</text>

  <!-- S3 boletos -->
  <rect class="box aws" x="830" y="130" width="145" height="55"/>
  <text class="t" x="902" y="153">Amazon S3</text>
  <text class="s" x="902" y="171">boletos PDF · reportes</text>

  <!-- SNS -->
  <rect class="box msg" x="830" y="215" width="145" height="55"/>
  <text class="t" x="902" y="238">Amazon SNS</text>
  <text class="s" x="902" y="256">correo a usuarios</text>

  <!-- Secrets -->
  <rect class="box sec" x="660" y="290" width="112" height="50"/>
  <text class="t" x="716" y="311">Secrets Manager</text>
  <text class="s" x="716" y="328">llave HMAC del QR</text>

  <!-- EventBridge -->
  <rect class="box msg" x="480" y="395" width="150" height="55"/>
  <text class="t" x="555" y="418">EventBridge</text>
  <text class="s" x="555" y="436">Scheduler (cada hora)</text>

  <!-- recordatorios -->
  <rect class="box lam" x="660" y="395" width="150" height="55"/>
  <text class="t" x="735" y="418">λ recordatorios</text>
  <text class="s" x="735" y="436">y reporte de asistencia</text>

  <!-- CloudWatch -->
  <rect class="box sec" x="830" y="300" width="145" height="150"/>
  <text class="t" x="902" y="325">CloudWatch</text>
  <text class="s" x="902" y="347">Logs de Lambda</text>
  <text class="s" x="902" y="366">5 métricas</text>
  <text class="s" x="902" y="385">2 alarmas → SNS</text>
  <text class="s" x="902" y="404">1 dashboard</text>
  <text class="s" x="902" y="428" font-style="italic">(recibe de todos)</text>

  <!-- generic links -->
  <path class="l" d="M145,205 L185,205"/>
  <path class="l" d="M310,205 L335,205"/>
  <path class="l" d="M450,205 L480,205"/>
  <path class="l" d="M630,205 L660,205"/>

  <!-- Flow 1 (blue) -->
  <path class="f1" d="M450,180 L465,180 L465,85 L480,85"/>
  <path class="f1" d="M630,78 L660,68"/>
  <path class="f1" d="M630,95 L675,165"/>
  <path class="f1" d="M790,67 L830,67"/>
  <path class="f1" d="M902,95 L902,130"/>
  <path class="f1" d="M960,95 L960,110 L985,110 L985,242 L975,242"/>
  <path class="f1" d="M840,95 L775,165"/>
  <circle cx="465" cy="130" r="9" fill="#2563eb"/><text class="n" x="465" y="134">1</text>

  <!-- Flow 2 (green) -->
  <path class="f2" d="M450,232 L465,232 L465,315 L480,315"/>
  <path class="f2" d="M630,315 L660,315"/>
  <path class="f2" d="M600,290 L680,245"/>
  <circle cx="465" cy="275" r="9" fill="#16a34a"/><text class="n" x="465" y="279">2</text>

  <!-- Flow 3 (orange) -->
  <path class="f3" d="M630,422 L660,422"/>
  <path class="f3" d="M782,395 L782,245"/>
  <path class="f3" d="M810,405 L818,405 L818,178 L830,178"/>
  <path class="f3" d="M810,440 L822,440 L822,262 L830,262"/>
  <circle cx="645" cy="400" r="9" fill="#ea580c"/><text class="n" x="645" y="404">3</text>

  <!-- CI/CD band -->
  <rect x="15" y="495" width="975" height="52" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="30" y="516" font-size="14" font-weight="700" fill="#0f172a">GitHub → GitHub Actions</text>
  <text x="30" y="536" font-size="12" fill="#475569">push / PR a main: pytest (pruebas unitarias) → terraform apply (infra/) → deploy de Lambdas → build del frontend y sync a S3</text>
  

  <!-- legend -->
  <g transform="translate(15,20)">
    <line x1="0" y1="8" x2="22" y2="8" stroke="#2563eb" stroke-width="2.5"/><text class="cap" x="28" y="12">1 Compra y emisión</text>
    <line x1="0" y1="28" x2="22" y2="28" stroke="#16a34a" stroke-width="2.5"/><text class="cap" x="28" y="32">2 Check-in con QR</text>
    <line x1="0" y1="48" x2="22" y2="48" stroke="#ea580c" stroke-width="2.5"/><text class="cap" x="28" y="52">3 Recordatorios/reporte</text>
  </g>
</svg>

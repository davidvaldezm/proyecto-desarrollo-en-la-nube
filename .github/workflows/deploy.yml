name: Deploy

# Cada integración a main corre las pruebas y despliega a AWS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false # nunca interrumpir un terraform apply

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -v
        working-directory: backend

  deploy:
    name: Desplegar a AWS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AWS Academy: las credenciales del Learner Lab vencen cada ~4 h.
      # Al iniciar el lab, copiar "AWS Details > AWS CLI" a los secrets del repo.
      - name: Revisar credenciales
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Faltan los secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Desplegar
        run: |
          set -o pipefail
          ./scripts/deploy.sh dev 2>&1 | tee deploy.log

      # Si algo falla, las últimas líneas del log aparecen como anotación en el resumen del run.
      - name: Resumen del error
        if: failure()
        run: |
          [ -f deploy.log ] || exit 0
          tail -n 60 deploy.log | sed 's/\x1b\[[0-9;]*m//g' > tail.log
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' tail.log)
          echo "::error title=Deploy falló::${msg}"

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main lo cubre deploy.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: Build del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    name: Terraform fmt y validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: terraform fmt
        # Si falla, el diff aparece como anotación en el PR.
        run: |
          if ! terraform fmt -check -recursive -diff > fmt.diff 2>&1; then
            diff=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' fmt.diff)
            echo "::error title=terraform fmt::Ejecuta 'terraform fmt -recursive' en infra/%0A${diff}"
            exit 1
          fi
      - run: terraform init -backend=false -input=false
      - run: terraform validate
